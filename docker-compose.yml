# Local development database: Postgres 16 with pgvector.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pc
      POSTGRES_PASSWORD: pc
      POSTGRES_DB: policy_compass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
